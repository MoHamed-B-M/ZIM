name: Build app (beta)

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:

# New push supersedes the previous beta build.
concurrency:
  group: zim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

# The Android project lives at this repo's root.
jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept licenses & install Android platforms
        # compileSdk 37 rides the canary channel; 36 is the stable fallback.
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;37.0.0" \
            || echo "android-37 not installable — using preinstalled platform (if any)"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zim-beta-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
